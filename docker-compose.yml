# Ejecución local de toda la plataforma:
#   cp .env.example .env   (y editar la contraseña)
#   docker compose up --build
# Aplicación en http://localhost:8080

x-servicio-comun: &servicio
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &entorno
    SPRING_PROFILES_ACTIVE: prod
    DB_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clientes:
    <<: *servicio
    build: ./microservicio-clientes
    environment:
      <<: *entorno
      DB_URL: jdbc:postgresql://postgres:5432/clientes_db

  productos:
    <<: *servicio
    build: ./microservicio-productos
    environment:
      <<: *entorno
      DB_URL: jdbc:postgresql://postgres:5432/productos_db

  inventario:
    <<: *servicio
    build: ./microservicio-inventario
    environment:
      <<: *entorno
      DB_URL: jdbc:postgresql://postgres:5432/inventario_db

  ventas:
    <<: *servicio
    build: ./microservicio-ventas
    environment:
      <<: *entorno
      DB_URL: jdbc:postgresql://postgres:5432/ventas_db
      SERVICIOS_CLIENTES_URL: http://clientes:8080
      SERVICIOS_PRODUCTOS_URL: http://productos:8080
      SERVICIOS_INVENTARIO_URL: http://inventario:8080

  facturacion:
    <<: *servicio
    build: ./microservicio-facturacion
    environment:
      <<: *entorno
      DB_URL: jdbc:postgresql://postgres:5432/facturacion_db
      SERVICIOS_VENTAS_URL: http://ventas:8080

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - clientes
      - productos
      - inventario
      - ventas
      - facturacion

volumes:
  postgres-data:
