# EJEMPLO. No guardes contraseñas reales en el repositorio.
# Forma recomendada de crear el secreto (sin archivos):
#   kubectl -n <namespace> create secret generic db-credentials \
#     --from-literal=POSTGRES_USER=servicios \
#     --from-literal=POSTGRES_PASSWORD='<contraseña segura>'
# En producción, lo ideal es sincronizarlo desde Azure Key Vault con el Secrets Store CSI Driver.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  POSTGRES_USER: servicios
  POSTGRES_PASSWORD: CAMBIAR-POR-UNA-CONTRASENA-SEGURA
