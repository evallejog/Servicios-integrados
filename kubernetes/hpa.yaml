# Escalado automático por CPU. Requiere metrics-server (incluido en AKS).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clientes
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clientes
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
