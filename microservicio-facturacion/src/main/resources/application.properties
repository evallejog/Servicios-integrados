spring.application.name=facturacion
server.port=8085

# Desarrollo local y pruebas: base H2 en memoria (un esquema independiente por microservicio)
spring.datasource.url=jdbc:h2:mem:facturacion_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Observabilidad y sondas de Kubernetes (/actuator/health/liveness y /actuator/health/readiness)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Dependencias HTTP hacia otros microservicios
servicios.ventas.url=${SERVICIOS_VENTAS_URL:http://localhost:8084}
servicios.timeout-ms=${SERVICIOS_TIMEOUT_MS:3000}

# Porcentaje de IVA aplicado a las facturas (Colombia: 19)
facturacion.iva-porcentaje=${FACTURACION_IVA_PORCENTAJE:19}
