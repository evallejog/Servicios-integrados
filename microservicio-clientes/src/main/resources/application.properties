spring.application.name=clientes
server.port=8081

# Desarrollo local y pruebas: base H2 en memoria (un esquema independiente por microservicio)
spring.datasource.url=jdbc:h2:mem:clientes_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Observabilidad y sondas de Kubernetes (/actuator/health/liveness y /actuator/health/readiness)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
